name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download separation model
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-delay 5 \
            -o app/src/main/assets/models/UVR-MDX-NET-Voc_FT.onnx \
            https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/UVR-MDX-NET-Voc_FT.onnx)
          echo "Model size: $SIZE bytes"
          sha256sum app/src/main/assets/models/UVR-MDX-NET-Voc_FT.onnx
          test "$SIZE" -gt 50000000

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore "${{ runner.temp }}/release.jks" \
            -storepass vocalsplitter -keypass vocalsplitter \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VocalSplitter"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: vocalsplitter
          KEY_ALIAS: release
          KEY_PASSWORD: vocalsplitter
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk VocalSplitter.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vocal Splitter build ${{ github.run_number }}
          files: VocalSplitter.apk
          make_latest: true
